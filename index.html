<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Минсинеяратам</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        /* ===== CRITICAL INLINE STYLES ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000 !important;
        }

        body {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            color: #ECE6DE;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #story {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            background: #000000;
        }

        #text-container {
            max-width: 520px;
            width: 85%;
            text-align: center;
            padding: 40px 20px;
        }

        .story-line {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 300;
            font-style: italic;
            line-height: 1.6;
            letter-spacing: 0.02em;
            opacity: 0;
            transform: translateY(20px);
            transition: none;
            white-space: pre-wrap;
            color: #ECE6DE;
        }

        .story-line.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 2.4s cubic-bezier(0.22, 0.61, 0.36, 1),
                        transform 2.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .story-line.fade-out {
            opacity: 0;
            transition: opacity 2s cubic-bezier(0.55, 0.06, 0.68, 0.19);
        }

        /* ===== OVERLAYS ===== */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-btn {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-size: 20px;
            font-weight: 300;
            font-style: italic;
            color: #ECE6DE;
            background: transparent;
            border: 1px solid rgba(236, 230, 222, 0.25);
            padding: 16px 48px;
            border-radius: 100px;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: all 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        #start-btn:hover {
            border-color: rgba(236, 230, 222, 0.6);
            background: rgba(236, 230, 222, 0.04);
        }

        #start-btn:active {
            transform: scale(0.97);
        }

        #replay-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease;
            background: #000000;
        }

        #replay-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #replay-btn {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-size: 18px;
            font-weight: 300;
            font-style: italic;
            color: rgba(236, 230, 222, 0.35);
            background: transparent;
            border: 1px solid rgba(236, 230, 222, 0.12);
            padding: 14px 40px;
            border-radius: 100px;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: all 1.5s cubic-bezier(0.22, 0.61, 0.36, 1);
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        #replay-btn:hover {
            color: rgba(236, 230, 222, 0.7);
            border-color: rgba(236, 230, 222, 0.3);
        }

        #replay-btn:active {
            transform: scale(0.97);
        }

        #story.fade-to-black {
            opacity: 0;
            transition: opacity 3s ease;
        }

        @supports (-webkit-touch-callout: none) {
            body, #story {
                height: -webkit-fill-available;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .story-line.visible {
                transition: opacity 0.5s ease;
                transform: none;
            }
            #start-overlay.hidden,
            #replay-overlay.visible,
            #story.fade-to-black {
                transition: opacity 0.5s ease;
            }
        }
    </style>
</head>
<body>
    <div id="story">
        <div id="text-container"></div>
    </div>

    <div id="start-overlay">
        <button id="start-btn">Начать</button>
    </div>

    <div id="replay-overlay">
        <button id="replay-btn">Прожить снова</button>
    </div>

    <audio id="music" src="audio/song.mp3" preload="auto"></audio>

    <script>
// ===== STORY SCRIPT =====
const storyScript = [
    // === SCENE 1 ===
    { type: 'pause', duration: 2000 },
    { type: 'line', text: 'Привет,' },
    { type: 'pause', duration: 1800 },
    { type: 'line', text: 'Альбина.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 2 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Сегодня тебе' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: '35' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Красивый возраст.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 3 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Возраст,' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'когда уже многое понимаешь.' },
    { type: 'pause', duration: 1800 },
    { type: 'line', text: 'И всё ещё столько всего впереди.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 4 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Сегодня не будет' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'длинной открытки.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 5 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Иногда одной песни достаточно...' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 6 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: '...чтобы сказать больше,' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'чем открыткой.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 7 ===
    { type: 'pause', duration: 2000 },
    { type: 'line', text: 'Помнишь?' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 8 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Ты написала мне' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: '«Божечки!!!' },
    { type: 'pause', duration: 1000 },
    { type: 'line', text: 'Какая песня!!!»' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 9 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Наверное,' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'некоторые песни' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'становятся больше,' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'чем просто музыкой.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 10 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Я продолжаю видеть' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'в ней нас.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 11 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Спасибо.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 12 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'За разговоры.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 13 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'За смех.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 14 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'За ту тишину,' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'в которой' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'становилось спокойно.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 15 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'За ощущение,' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'что рядом' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'можно быть настоящим.' },
    { type: 'pause', duration: 4000 },
    { type: 'fadeOut', duration: 3000 },

    // === LONG PAUSE ===
    { type: 'pause', duration: 4000 },

    // === SCENE 16 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Знаешь...' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 17 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Если бы' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'у меня была' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'такая кнопка...' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 18 ===
    { type: 'pause', duration: 2000 },
    { type: 'line', text: '«Прожить снова»' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 19 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Я бы нажимал её' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'снова' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'и снова.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 20 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'Не потому,' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'что хочется' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'вернуть время.' },
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 21 ===
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'А потому,' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'что некоторые моменты' },
    { type: 'pause', duration: 1500 },
    { type: 'line', text: 'хочется' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'почувствовать' },
    { type: 'pause', duration: 1200 },
    { type: 'line', text: 'ещё раз.' },
    { type: 'pause', duration: 3000 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 22 ===
    { type: 'pause', duration: 2500 },
    { type: 'fadeOut', duration: 2000 },

    // === SCENE 23 ===
    { type: 'pause', duration: 2000 },
    { type: 'line', text: 'Ты прекрасна.' },
    { type: 'pause', duration: 3000 },
    // After this: 3 seconds of silence, then replay button
];

// ===== STATE =====
let currentStep = 0;
let isPlaying = false;
let activeLines = [];
const music = document.getElementById('music');
const textContainer = document.getElementById('text-container');
const startOverlay = document.getElementById('start-overlay');
const startBtn = document.getElementById('start-btn');
const replayOverlay = document.getElementById('replay-overlay');
const replayBtn = document.getElementById('replay-btn');
const story = document.getElementById('story');

// ===== HELPERS =====
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function createLine(text) {
    const line = document.createElement('div');
    line.className = 'story-line';
    line.textContent = text;
    textContainer.appendChild(line);

    // Force reflow
    line.offsetHeight;

    return line;
}

function showLine(line) {
    return new Promise(resolve => {
        const onTransitionEnd = (e) => {
            if (e.propertyName === 'opacity') {
                line.removeEventListener('transitionend', onTransitionEnd);
                resolve();
            }
        };
        line.addEventListener('transitionend', onTransitionEnd);

        // Fallback
        setTimeout(resolve, 2600);

        requestAnimationFrame(() => {
            line.classList.add('visible');
        });
    });
}

function fadeOutAll() {
    return new Promise(resolve => {
        const lines = textContainer.querySelectorAll('.story-line');
        if (lines.length === 0) {
            resolve();
            return;
        }

        let completed = 0;
        const total = lines.length;

        const checkComplete = () => {
            completed++;
            if (completed >= total) {
                textContainer.innerHTML = '';
                resolve();
            }
        };

        lines.forEach(line => {
            const onTransitionEnd = (e) => {
                if (e.propertyName === 'opacity') {
                    line.removeEventListener('transitionend', onTransitionEnd);
                    checkComplete();
                }
            };
            line.addEventListener('transitionend', onTransitionEnd);
            line.classList.add('fade-out');
        });

        // Fallback
        setTimeout(() => {
            textContainer.innerHTML = '';
            resolve();
        }, 2500);
    });
}

// ===== STORY ENGINE =====
async function playStory() {
    currentStep = 0;
    isPlaying = true;

    while (currentStep < storyScript.length && isPlaying) {
        const step = storyScript[currentStep];

        switch (step.type) {
            case 'pause':
                await wait(step.duration);
                break;

            case 'line':
                const line = createLine(step.text);
                await showLine(line);
                break;

            case 'fadeOut':
                await fadeOutAll();
                break;
        }

        currentStep++;
    }

    // Story ended — 3 seconds of silence
    await wait(3000);

    // Show replay button
    replayOverlay.classList.add('visible');
}

// ===== START =====
startBtn.addEventListener('click', async () => {
    startOverlay.classList.add('hidden');

    // Try to play music
    try {
        music.volume = 0.7;
        await music.play();
    } catch (e) {
        console.log('Autoplay blocked, waiting for interaction');
    }

    await wait(1000);
    playStory();
});

// ===== REPLAY =====
replayBtn.addEventListener('click', async () => {
    replayOverlay.classList.remove('visible');

    // Fade to black
    story.classList.add('fade-to-black');

    await wait(3000);

    // Reset
    textContainer.innerHTML = '';
    story.classList.remove('fade-to-black');
    currentStep = 0;

    // Restart music
    music.currentTime = 0;
    try {
        await music.play();
    } catch (e) {
        console.log('Music replay failed');
    }

    await wait(500);
    playStory();
});

// ===== SAFARI AUDIO UNLOCK =====
document.addEventListener('touchstart', function unlockAudio() {
    if (music.paused) {
        music.play().then(() => {
            music.pause();
            music.currentTime = 0;
        }).catch(() => {});
    }
    document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

// ===== VISIBILITY API =====
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        music.pause();
    } else if (isPlaying && !startOverlay.classList.contains('hidden')) {
        // Don't auto-resume if we're in the middle
    }
});

    </script>
</body>
</html>
